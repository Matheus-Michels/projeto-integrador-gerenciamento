version: "3.8"
services:
  db:
    image: postgres:15-alpine
    container_name: postgres_pi
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: gerenciamento_atividades
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d gerenciamento_atividades"]
      interval: 5s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: supertokens_pi
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_USER: root
      POSTGRESQL_PASSWORD: root
      POSTGRESQL_DATABASE_NAME: gerenciamento_atividades
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432

volumes:
  pgdata:
